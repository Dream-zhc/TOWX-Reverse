name: Build TrollOpen 1.4.0 TOWX V11 Smooth Fix2

on:
  push:
    branches:
      - test/trollopen-1.4.0-v11-smooth
    paths:
      - 'SpringBoardDataBridge/**'
      - '.github/workflows/build-trollopen140-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/.theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install dpkg ldid

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --depth 1

      - name: Bind Xcode iPhoneOS SDK
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p "$THEOS/sdks"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Build V11 Smooth Fix2 bridge
        working-directory: SpringBoardDataBridge
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"

          mkdir -p ../out-v11-fix2
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" ../out-v11-fix2/TOWX-SpringBoard-V11-Smooth1-Fix2.deb
          dpkg-deb -x "$DEB" ../out-v11-fix2/extracted

          DYLIB="$(find ../out-v11-fix2/extracted -name 'TOWXSpringBoardDataBridge.dylib' -type f -print -quit)"
          PLIST="$(find ../out-v11-fix2/extracted -name 'TOWXSpringBoardDataBridge.plist' -type f -print -quit)"
          test -n "$DYLIB"
          test -n "$PLIST"

          strings "$DYLIB" | grep -Fq 'Smooth1-FINAL2|bundle-bfs+splitBundleID+bundle-change-detect+2s-watchdog'
          strings "$DYLIB" | grep -Fq 'Smooth1-FIX1|underlying-workspace-context'
          strings "$DYLIB" | grep -Fq 'Smooth1-FIX2|compact-anchor+fail-closed+minimize-hard-hide+3-frame-settle'
          strings "$DYLIB" | grep -Fq 'Smooth1-FIX2|44pt+edge-shield+always-cancel-controls+partial-next-item'
          strings "$DYLIB" | grep -Fq 'Smooth1-S5|interruptible-property-animator'
          strings "$DYLIB" | grep -Fq 'Smooth1-FIX1|underlying-host-gate|wechat=com.tencent.xin'
          strings "$DYLIB" | grep -Fq 'Smooth1-S7|background-imageio+2s-watchdog'
          strings "$DYLIB" | grep -Fq 'Smooth1-FIX2|flush-edge+44pt-scroll+fail-closed-geometry+minimize-hard-hide'
          strings "$DYLIB" | grep -Fq 'diameter=44|edgeShield=10|portrait=bottom|landscape=right'

          if strings "$DYLIB" | grep -Fq 'Smooth1-FIX1|visual-container-presentation+display-link'; then
            echo 'ERROR: Fix1 follower still linked'
            exit 1
          fi
          if strings "$DYLIB" | grep -Fq 'Smooth1-FIX1|native-scroll+uicontrol+forced-range-diagnostics'; then
            echo 'ERROR: Fix1 avatar view still linked'
            exit 1
          fi
          if strings "$DYLIB" | grep -Fq 'TOWX|SB|P2A4|LOADED|v0.10.0'; then
            echo 'ERROR: legacy V10 product still linked'
            exit 1
          fi
          if strings "$DYLIB" | grep -Fq 'TOWX|SB|140ANCHOR|LOADED'; then
            echo 'ERROR: legacy 1.4 anchor shim still linked'
            exit 1
          fi

          cp "$DYLIB" ../out-v11-fix2/TOWXSpringBoardDataBridge.dylib
          cp "$PLIST" ../out-v11-fix2/TOWXSpringBoardDataBridge.plist
          file ../out-v11-fix2/TOWXSpringBoardDataBridge.dylib
          shasum -a 256 ../out-v11-fix2/TOWXSpringBoardDataBridge.dylib > ../out-v11-fix2/SHA256SUMS.txt

      - name: Upload V11 Smooth Fix2 bridge
        uses: actions/upload-artifact@v4
        with:
          name: TOWX-V11-Smooth1-Fix2
          path: |
            out-v11-fix2/TOWX-SpringBoard-V11-Smooth1-Fix2.deb
            out-v11-fix2/TOWXSpringBoardDataBridge.dylib
            out-v11-fix2/TOWXSpringBoardDataBridge.plist
            out-v11-fix2/SHA256SUMS.txt
