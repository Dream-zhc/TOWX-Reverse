name: Patch Fix3 Geometry Refinements

on:
  push:
    branches:
      - test/trollopen-1.4.0-v11-smooth
    paths:
      - '.github/workflows/patch-fix3-geometry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/trollopen-1.4.0-v11-smooth
      - name: Refine orientation and visible gap
        run: |
          python3 -c "from pathlib import Path; p=Path('SpringBoardDataBridge/TOWXV11WindowFollowerFix3.m'); s=p.read_text(); old='static BOOL TOWXIsLandscapeFix3(UIInterfaceOrientation orientation, CGRect bounds) {\\n    if (UIInterfaceOrientationIsLandscape(orientation)) return YES;\\n    if (UIInterfaceOrientationIsPortrait(orientation)) return NO;\\n    return CGRectGetWidth(bounds) > CGRectGetHeight(bounds);\\n}'; new='static BOOL TOWXIsLandscapeFix3(UIInterfaceOrientation orientation, CGRect bounds) {\\n    BOOL byGeometry = CGRectGetWidth(bounds) > CGRectGetHeight(bounds);\\n    if (orientation == UIInterfaceOrientationUnknown) return byGeometry;\\n    BOOL byOrientation = UIInterfaceOrientationIsLandscape(orientation);\\n    return byOrientation == byGeometry ? byOrientation : byGeometry;\\n}'; assert old in s; p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('SpringBoardDataBridge/TOWXV11AvatarViewFix3.m'); s=p.read_text(); assert 'CGFloat x = edgeShield + visualGap + padding;' in s and 'CGFloat y = edgeShield + visualGap + padding;' in s; s=s.replace('CGFloat x = edgeShield + visualGap + padding;', 'CGFloat x = edgeShield + visualGap;',1).replace('CGFloat y = edgeShield + visualGap + padding;', 'CGFloat y = edgeShield + visualGap;',1); p.write_text(s)"
      - name: Commit refinements
        run: |
          git config user.name 'Dream-zhc Actions'
          git config user.email '83204117+Dream-zhc@users.noreply.github.com'
          git add SpringBoardDataBridge/TOWXV11WindowFollowerFix3.m SpringBoardDataBridge/TOWXV11AvatarViewFix3.m
          git commit -m 'fix: trust scene geometry and keep visible avatar gap at 5pt'
          git push origin HEAD:test/trollopen-1.4.0-v11-smooth
