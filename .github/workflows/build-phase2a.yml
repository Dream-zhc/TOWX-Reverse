name: Build TOWX Phase 2A — TWO DEBs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'WeChatBackend/**'
      - 'SpringBoardDataBridge/**'
      - 'reference/**'
      - '.github/workflows/build-phase2a.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/.theos
      THEOS_PACKAGE_SCHEME: roothide
      GOLDEN_TROLLOPEN_DEB_SHA256: 689c1b71fcbf02e94d1cc26cf8ef6d73c3f9f3a8b585abafeaa2292a92a605d0
      GOLDEN_TROLLOPEN_CORE_SHA256: 5bac29748b81bc07131f8c641a41f4a102a3b2e9cb8447007b753716369ef802

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Phase 2A repository layout
        run: |
          set -euo pipefail
          test -f WeChatBackend/Makefile
          test -f WeChatBackend/TOWXWeChatBackend.m
          test -f WeChatBackend/TOWXWeChatBackend.plist
          test -f SpringBoardDataBridge/Makefile
          test -f SpringBoardDataBridge/TOWXSpringBoardDataBridge.c
          test -f SpringBoardDataBridge/TOWXSpringBoardDataBridge.plist
          test -f reference/TrollOpen-1.3.7-wxbar1-test.deb
          test -f .github/workflows/build-phase2a.yml
          if [ -d TOWX-Reverse-Phase2A ]; then
            echo 'ERROR: Phase2A is nested under TOWX-Reverse-Phase2A/. Files must be at repository root.' >&2
            exit 1
          fi
          echo "$GOLDEN_TROLLOPEN_DEB_SHA256  reference/TrollOpen-1.3.7-wxbar1-test.deb" | shasum -a 256 -c -

      - name: Install packaging tools
        run: brew install dpkg ldid

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --depth 1
          echo "THEOS=$(git -C "$THEOS" rev-parse HEAD)"

      - name: Bind actual Xcode iPhoneOS SDK into Theos
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Xcode iPhoneOS SDK version: $SDK_VERSION"
          echo "Xcode iPhoneOS SDK path: $SDK_PATH"
          test -d "$SDK_PATH"
          mkdir -p "$THEOS/sdks"
          THEOS_SDK="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          rm -rf "$THEOS_SDK"
          ln -s "$SDK_PATH" "$THEOS_SDK"
          test -d "$THEOS_SDK"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "THEOS_SDK=$THEOS_SDK" >> "$GITHUB_ENV"

      - name: Build WeChat backend
        working-directory: WeChatBackend
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64 TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64 TARGET="$TARGET_VALUE"
          mkdir -p ../out
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" ../out/TOWX-WeChatBackend-8.0.69-P2A.deb

      - name: Build SpringBoard data bridge
        working-directory: SpringBoardDataBridge
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" ../out/TOWX-SpringBoardDataBridge-P2A.deb

      - name: Verify compiled backend and bridge
        run: |
          set -euo pipefail
          rm -rf verify-wx verify-sb
          mkdir verify-wx verify-sb
          dpkg-deb -x out/TOWX-WeChatBackend-8.0.69-P2A.deb verify-wx
          dpkg-deb -x out/TOWX-SpringBoardDataBridge-P2A.deb verify-sb
          WX="$(find verify-wx -name 'TOWXWeChatBackend.dylib' -type f -print -quit)"
          SB="$(find verify-sb -name 'TOWXSpringBoardDataBridge.dylib' -type f -print -quit)"
          WXPLIST="$(find verify-wx -name 'TOWXWeChatBackend.plist' -type f -print -quit)"
          SBPLIST="$(find verify-sb -name 'TOWXSpringBoardDataBridge.plist' -type f -print -quit)"
          test -n "$WX" && test -n "$SB" && test -n "$WXPLIST" && test -n "$SBPLIST"
          test "$(lipo -archs "$WX")" = "arm64"
          SB_ARCHS="$(lipo -archs "$SB")"
          echo "$SB_ARCHS" | grep -qw arm64
          echo "$SB_ARCHS" | grep -qw arm64e
          strings "$WX" | grep -Fq 'TOWX|WX|P2A|PUSH'
          strings "$SB" | grep -Fq 'TOWX|SB|P2A|AVATAR0-PASS'
          plutil -p "$WXPLIST" | grep -Fq 'com.tencent.xin'
          plutil -p "$SBPLIST" | grep -Fq 'com.apple.springboard'
          if plutil -p "$WXPLIST" | grep -Fq 'com.apple.UIKit'; then
            echo 'Unsafe broad UIKit filter detected' >&2
            exit 1
          fi

      - name: Repack golden TrollOpen without changing TrollOpenJB.dylib
        run: |
          set -euo pipefail
          BASE=reference/TrollOpen-1.3.7-wxbar1-test.deb
          STAGE="$RUNNER_TEMP/trollopen-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          dpkg-deb -R "$BASE" "$STAGE"

          CORE="$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/TrollOpenJB.dylib"
          echo "$GOLDEN_TROLLOPEN_CORE_SHA256  $CORE" | shasum -a 256 -c -

          SB_DYLIB="$(find verify-sb -name 'TOWXSpringBoardDataBridge.dylib' -type f -print -quit)"
          SB_PLIST="$(find verify-sb -name 'TOWXSpringBoardDataBridge.plist' -type f -print -quit)"
          DEST="$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp "$SB_DYLIB" "$DEST/TOWXSpringBoardDataBridge.dylib"
          cp "$SB_PLIST" "$DEST/TOWXSpringBoardDataBridge.plist"

          perl -0pi -e 's/^Version:.*$/Version: 1.3.7-wxbar1+TOWX.P2A/m' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" out/TrollOpen-1.3.7-wxbar1-TOWX-P2A.deb

          rm -rf verify-troll
          mkdir verify-troll
          dpkg-deb -x out/TrollOpen-1.3.7-wxbar1-TOWX-P2A.deb verify-troll
          NEW_CORE=verify-troll/var/jb/Library/MobileSubstrate/DynamicLibraries/TrollOpenJB.dylib
          echo "$GOLDEN_TROLLOPEN_CORE_SHA256  $NEW_CORE" | shasum -a 256 -c -
          test -f verify-troll/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXSpringBoardDataBridge.dylib
          test -f verify-troll/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXSpringBoardDataBridge.plist

      - name: Produce exactly two deliverable DEBs
        run: |
          set -euo pipefail
          rm -f out/TOWX-SpringBoardDataBridge-P2A.deb
          test -f out/TOWX-WeChatBackend-8.0.69-P2A.deb
          test -f out/TrollOpen-1.3.7-wxbar1-TOWX-P2A.deb
          COUNT="$(find out -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
          test "$COUNT" = "2"
          shasum -a 256 out/*.deb > out/SHA256SUMS.txt
          echo 'Phase 2A deliverables:'
          ls -lh out/*.deb
          cat out/SHA256SUMS.txt

      - name: Upload Phase 2A packages
        uses: actions/upload-artifact@v4
        with:
          name: TOWX-Reverse-Phase2A
          path: |
            out/TOWX-WeChatBackend-8.0.69-P2A.deb
            out/TrollOpen-1.3.7-wxbar1-TOWX-P2A.deb
            out/SHA256SUMS.txt
          if-no-files-found: error
