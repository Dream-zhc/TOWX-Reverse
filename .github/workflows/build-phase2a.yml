name: Build TOWX Phase 2A.2 — Golden 0.6 Adapter

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'WeChatGoldenAdapter/**'
      - 'SpringBoardDataBridge/**'
      - 'reference/**'
      - '.github/workflows/build-phase2a.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/.theos
      THEOS_PACKAGE_SCHEME: roothide
      GOLDEN_TROLLOPEN_DEB_SHA256: 689c1b71fcbf02e94d1cc26cf8ef6d73c3f9f3a8b585abafeaa2292a92a605d0
      GOLDEN_TROLLOPEN_CORE_SHA256: 5bac29748b81bc07131f8c641a41f4a102a3b2e9cb8447007b753716369ef802
      GOLDEN_WECHAT_DEB_SHA256: 54487e5514b086b09fed00b2cf6b8d06496a78a185a340ef701446921c1ba878
      GOLDEN_WECHAT_DYLIB_SHA256: cecc6570098d383ef1fb3f65b46672c16966a9e0324854b4e4d1a4d4e4e4c66f

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify P2A2 repository layout and golden inputs
        run: |
          set -euo pipefail
          test -f WeChatGoldenAdapter/Makefile
          test -f WeChatGoldenAdapter/TOWXGoldenAdapter.m
          test -f WeChatGoldenAdapter/TOWXGoldenAdapter.plist
          test -f SpringBoardDataBridge/Makefile
          test -f SpringBoardDataBridge/TOWXSpringBoardDataBridge.c
          test -f SpringBoardDataBridge/TOWXSpringBoardDataBridge.plist
          test -f reference/TrollOpen-1.3.7-wxbar1-test.deb
          test -f reference/TOWX-WeChatStandalone-8.0.69-0.6.0-clean1.deb.b64
          echo "$GOLDEN_TROLLOPEN_DEB_SHA256  reference/TrollOpen-1.3.7-wxbar1-test.deb" | shasum -a 256 -c -
          python3 - <<'PY'
          import base64, pathlib
          src = pathlib.Path('reference/TOWX-WeChatStandalone-8.0.69-0.6.0-clean1.deb.b64')
          pathlib.Path('/tmp/TOWX-WeChatStandalone-0.6.0-clean1.deb').write_bytes(base64.b64decode(src.read_text().strip()))
          PY
          echo "$GOLDEN_WECHAT_DEB_SHA256  /tmp/TOWX-WeChatStandalone-0.6.0-clean1.deb" | shasum -a 256 -c -

      - name: Install packaging tools
        run: brew install dpkg ldid

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --depth 1

      - name: Bind actual Xcode iPhoneOS SDK into Theos
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p "$THEOS/sdks"
          THEOS_SDK="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          rm -rf "$THEOS_SDK"
          ln -s "$SDK_PATH" "$THEOS_SDK"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "THEOS_SDK=$THEOS_SDK" >> "$GITHUB_ENV"

      - name: Build read-only WeChat golden adapter
        working-directory: WeChatGoldenAdapter
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64 TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64 TARGET="$TARGET_VALUE"
          mkdir -p ../out ../verify-adapter
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" ../verify-adapter

      - name: Build SpringBoard golden count bridge
        working-directory: SpringBoardDataBridge
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          mkdir -p ../verify-sb
          dpkg-deb -x "$DEB" ../verify-sb

      - name: Verify adapter and SpringBoard binaries
        run: |
          set -euo pipefail
          ADAPTER="$(find verify-adapter -name 'TOWXGoldenAdapter.dylib' -type f -print -quit)"
          ADAPTER_PLIST="$(find verify-adapter -name 'TOWXGoldenAdapter.plist' -type f -print -quit)"
          SB="$(find verify-sb -name 'TOWXSpringBoardDataBridge.dylib' -type f -print -quit)"
          SB_PLIST="$(find verify-sb -name 'TOWXSpringBoardDataBridge.plist' -type f -print -quit)"
          test -n "$ADAPTER" && test -n "$ADAPTER_PLIST" && test -n "$SB" && test -n "$SB_PLIST"
          test "$(lipo -archs "$ADAPTER")" = "arm64"
          SB_ARCHS="$(lipo -archs "$SB")"
          echo "$SB_ARCHS" | grep -qw arm64
          echo "$SB_ARCHS" | grep -qw arm64e
          strings "$ADAPTER" | grep -Fq 'TOWX|WX|P2A2|ADAPTER-START'
          strings "$ADAPTER" | grep -Fq 'goldenOffsets=table:0x4070,count:0x4078'
          strings "$ADAPTER" | grep -Fq 'TOWXWeChatStandalone.dylib'
          if strings "$ADAPTER" | grep -Fq 'visibleCells'; then
            echo 'ERROR: adapter contains scanner API; P2A2 must not rescan WeChat UI' >&2
            exit 1
          fi
          strings "$SB" | grep -Fq 'TOWX|SB|P2A2|COUNT-PASS'
          plutil -p "$ADAPTER_PLIST" | grep -Fq 'com.tencent.xin'
          plutil -p "$SB_PLIST" | grep -Fq 'com.apple.springboard'

      - name: Repack exact golden WeChat 0.6 with adapter
        run: |
          set -euo pipefail
          GOLDEN=/tmp/TOWX-WeChatStandalone-0.6.0-clean1.deb
          STAGE="$RUNNER_TEMP/wechat-golden-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          dpkg-deb -R "$GOLDEN" "$STAGE"

          GOLDEN_DYLIB="$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXWeChatStandalone.dylib"
          echo "$GOLDEN_WECHAT_DYLIB_SHA256  $GOLDEN_DYLIB" | shasum -a 256 -c -

          ADAPTER="$(find verify-adapter -name 'TOWXGoldenAdapter.dylib' -type f -print -quit)"
          ADAPTER_PLIST="$(find verify-adapter -name 'TOWXGoldenAdapter.plist' -type f -print -quit)"
          DEST="$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp "$ADAPTER" "$DEST/TOWXGoldenAdapter.dylib"
          cp "$ADAPTER_PLIST" "$DEST/TOWXGoldenAdapter.plist"

          perl -0pi -e 's/^Package:.*$/Package: com.dream.towxreverse.wechatbackend/m; s/^Name:.*$/Name: TOWX WeChat Golden 0.6 + Adapter/m; s/^Version:.*$/Version: 0.6.0-clean1+TOWX.P2A2/m; s/^Description:.*$/Description: Exact verified WeChat 0.6 scanner plus read-only P2A2 cache adapter./m' "$STAGE/DEBIAN/control"
          if grep -q '^Conflicts:' "$STAGE/DEBIAN/control"; then
            perl -0pi -e 's/^Conflicts:.*$/Conflicts: com.dream.towxwechatstandalone, com.dream.trollopenwxbridge/m' "$STAGE/DEBIAN/control"
          else
            printf '\nConflicts: com.dream.towxwechatstandalone, com.dream.trollopenwxbridge\n' >> "$STAGE/DEBIAN/control"
          fi
          if grep -q '^Replaces:' "$STAGE/DEBIAN/control"; then
            perl -0pi -e 's/^Replaces:.*$/Replaces: com.dream.towxwechatstandalone, com.dream.trollopenwxbridge/m' "$STAGE/DEBIAN/control"
          else
            printf 'Replaces: com.dream.towxwechatstandalone, com.dream.trollopenwxbridge\n' >> "$STAGE/DEBIAN/control"
          fi

          dpkg-deb -b "$STAGE" out/TOWX-WeChatGolden-8.0.69-0.6.0-P2A2-Adapter.deb

          rm -rf verify-wx-final
          mkdir verify-wx-final
          dpkg-deb -x out/TOWX-WeChatGolden-8.0.69-0.6.0-P2A2-Adapter.deb verify-wx-final
          FINAL_GOLDEN=verify-wx-final/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXWeChatStandalone.dylib
          echo "$GOLDEN_WECHAT_DYLIB_SHA256  $FINAL_GOLDEN" | shasum -a 256 -c -
          test -f verify-wx-final/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXGoldenAdapter.dylib
          test -f verify-wx-final/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXGoldenAdapter.plist

      - name: Repack golden TrollOpen with P2A2 bridge
        run: |
          set -euo pipefail
          BASE=reference/TrollOpen-1.3.7-wxbar1-test.deb
          STAGE="$RUNNER_TEMP/trollopen-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          dpkg-deb -R "$BASE" "$STAGE"

          CORE="$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/TrollOpenJB.dylib"
          echo "$GOLDEN_TROLLOPEN_CORE_SHA256  $CORE" | shasum -a 256 -c -

          SB="$(find verify-sb -name 'TOWXSpringBoardDataBridge.dylib' -type f -print -quit)"
          SB_PLIST="$(find verify-sb -name 'TOWXSpringBoardDataBridge.plist' -type f -print -quit)"
          DEST="$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries"
          rm -f "$DEST/TOWXSpringBoardBridge.dylib" "$DEST/TOWXSpringBoardBridge.plist"
          cp "$SB" "$DEST/TOWXSpringBoardDataBridge.dylib"
          cp "$SB_PLIST" "$DEST/TOWXSpringBoardDataBridge.plist"

          perl -0pi -e 's/^Version:.*$/Version: 1.3.7-wxbar1+TOWX.P2A2/m' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" out/TrollOpen-1.3.7-wxbar1-TOWX-P2A2-GoldenAdapter.deb

          rm -rf verify-troll
          mkdir verify-troll
          dpkg-deb -x out/TrollOpen-1.3.7-wxbar1-TOWX-P2A2-GoldenAdapter.deb verify-troll
          NEW_CORE=verify-troll/var/jb/Library/MobileSubstrate/DynamicLibraries/TrollOpenJB.dylib
          echo "$GOLDEN_TROLLOPEN_CORE_SHA256  $NEW_CORE" | shasum -a 256 -c -
          test -f verify-troll/var/jb/Library/MobileSubstrate/DynamicLibraries/TOWXSpringBoardDataBridge.dylib

      - name: Produce exactly two P2A2 test DEBs
        run: |
          set -euo pipefail
          test -f out/TOWX-WeChatGolden-8.0.69-0.6.0-P2A2-Adapter.deb
          test -f out/TrollOpen-1.3.7-wxbar1-TOWX-P2A2-GoldenAdapter.deb
          COUNT="$(find out -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
          test "$COUNT" = "2"
          shasum -a 256 out/*.deb > out/SHA256SUMS.txt
          {
            echo 'Phase 2A.2 Golden Adapter'
            echo 'WeChat scanner is the exact verified 0.6.0-clean1 binary (SHA256 cecc6570...c66f).'
            echo 'Adapter does NOT scan WeChat UI; it reads golden 0.6 cache count at 0x4078.'
            echo 'SpringBoard log: /var/mobile/TrollOpenJB/phase2a2.log'
            echo 'Success markers: GOLDEN-FOUND-PASS then COUNT-PASS.'
            echo 'WeChat adapter log: TOWX-GoldenAdapter.log in WeChat Caches.'
            echo 'The original 0.6 in-app test avatar strip remains visible in this diagnostic build.'
          } > out/TEST-NOTES.txt
          ls -lh out/*.deb
          cat out/SHA256SUMS.txt

      - name: Upload P2A2 packages
        uses: actions/upload-artifact@v4
        with:
          name: TOWX-Reverse-Phase2A2-GoldenAdapter
          path: |
            out/TOWX-WeChatGolden-8.0.69-0.6.0-P2A2-Adapter.deb
            out/TrollOpen-1.3.7-wxbar1-TOWX-P2A2-GoldenAdapter.deb
            out/SHA256SUMS.txt
            out/TEST-NOTES.txt
          if-no-files-found: error
