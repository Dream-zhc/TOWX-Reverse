name: Build TOWX V11 Smooth Fix4 Bundle

on:
  push:
    branches:
      - test/trollopen-1.4.0-v11-smooth
    paths:
      - 'SpringBoardDataBridge/**'
      - 'WeChatGoldenAdapter/**'
      - '.github/workflows/build-v11-fix4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: towx-v11-fix4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      THEOS: ${{ github.workspace }}/.theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install dpkg ldid

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --depth 1

      - name: Bind Xcode iPhoneOS SDK
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p "$THEOS/sdks"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Build SpringBoard Fix4
        working-directory: SpringBoardDataBridge
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="$TARGET_VALUE"
          mkdir -p ../out-fix4/sb
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" ../out-fix4/sb/TOWX-SpringBoard-V11-Smooth1-Fix4.deb
          dpkg-deb -x "$DEB" ../out-fix4/sb/extracted
          DYLIB="$(find ../out-fix4/sb/extracted -name 'TOWXSpringBoardDataBridge.dylib' -type f -print -quit)"
          test -n "$DYLIB"
          strings "$DYLIB" | grep -Fq '%Y-%m-%d %H:%M:%S'
          strings "$DYLIB" | grep -Fq 'Smooth1-FIX3B|portraitWidth=95pct|visibleGap=5|edgeShield=7|landscapeRail=5items|avatars=15'
          file "$DYLIB"
          cp "$DYLIB" ../out-fix4/sb/TOWXSpringBoardDataBridge.dylib
          shasum -a 256 "$DYLIB" > ../out-fix4/sb/SHA256SUMS.txt

      - name: Build WeChat Fix4 adapter
        working-directory: WeChatGoldenAdapter
        run: |
          set -euo pipefail
          TARGET_VALUE="iphone:clang:${SDK_VERSION}:15.0"
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64" TARGET="$TARGET_VALUE"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64" TARGET="$TARGET_VALUE"
          mkdir -p ../out-fix4/wx
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" ../out-fix4/wx/TOWX-WeChat-GoldenAdapter-0.10.1-Fix4.deb
          dpkg-deb -x "$DEB" ../out-fix4/wx/extracted
          DYLIB="$(find ../out-fix4/wx/extracted -name 'TOWXGoldenAdapter.dylib' -type f -print -quit)"
          test -n "$DYLIB"
          strings "$DYLIB" | grep -Fq 'standalone-optional+table-discovery+first15+direct-switch|max=15'
          strings "$DYLIB" | grep -Fq 'TABLE-DISCOVERY|v11'
          strings "$DYLIB" | grep -Fq 'STANDALONE-MISSING|v11|fallback=table-discovery'
          strings "$DYLIB" | grep -Fq 'DIRECT-SWITCH-SUCCESS'
          strings "$DYLIB" | grep -Fq '%Y-%m-%d %H:%M:%S'
          file "$DYLIB"
          cp "$DYLIB" ../out-fix4/wx/TOWXGoldenAdapter.dylib
          shasum -a 256 "$DYLIB" > ../out-fix4/wx/SHA256SUMS.txt

      - name: Upload Fix4 bundle
        uses: actions/upload-artifact@v4
        with:
          name: TOWX-V11-Smooth1-Fix4-Bundle
          path: |
            out-fix4/sb/TOWX-SpringBoard-V11-Smooth1-Fix4.deb
            out-fix4/sb/TOWXSpringBoardDataBridge.dylib
            out-fix4/sb/SHA256SUMS.txt
            out-fix4/wx/TOWX-WeChat-GoldenAdapter-0.10.1-Fix4.deb
            out-fix4/wx/TOWXGoldenAdapter.dylib
            out-fix4/wx/SHA256SUMS.txt
