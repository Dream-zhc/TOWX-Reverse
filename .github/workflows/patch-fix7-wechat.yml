name: Patch Fix7 WeChat Direct Switch

on:
  push:
    branches:
      - test/trollopen-1.4.0-v11-smooth
    paths:
      - '.github/workflows/patch-fix7-wechat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/trollopen-1.4.0-v11-smooth
          fetch-depth: 0

      - name: Patch WeChat V11 switch path
        env:
          REPLACEMENT_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('WeChatGoldenAdapter/TOWXGoldenAdapterV11.m')
          s = p.read_text()
          start = s.index('static void TOWXFallbackViaRoot(')
          end = s.index('static void TOWXHeavyTick(void) {')
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          s = s[:start] + replacement + s[end:]
          s = s.replace('TOWX|WX|P2A4|ADAPTER-START|v0.10.1', 'TOWX|WX|P2A4|ADAPTER-START|v0.10.2')
          p.write_text(s)

          control = Path('WeChatGoldenAdapter/control')
          c = control.read_text()
          c = c.replace('Version: 0.10.1-fix4', 'Version: 0.10.2-fix7')
          c = c.replace('Description: TOWX WeChat Fix4 adapter with up to 15 conversation snapshots, standalone-independent conversation-table discovery, offscreen cell prefetch, direct chat-to-chat switching, and stable avatar export.',
                        'Description: TOWX WeChat Fix7 adapter with up to 15 conversation snapshots, standalone-independent discovery, masked direct chat-to-chat switching without visible root-page flash, and stable avatar export.')
          control.write_text(c)
          PY
          git config user.name 'Dream-zhc CI'
          git config user.email 'actions@users.noreply.github.com'
          git add WeChatGoldenAdapter/TOWXGoldenAdapterV11.m WeChatGoldenAdapter/control
          git commit -m 'fix: make chat switching visually direct with masked handoff'
          git push origin HEAD:test/trollopen-1.4.0-v11-smooth
